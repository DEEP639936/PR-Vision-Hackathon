<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PR•VISION investigation report — evidence-first verdict with citations, claim-by-claim verification, media forensics and propagation intelligence." />
  <title>PR•VISION — Investigation Report</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d2735'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%234a8cff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/styles.css?v=2.0.0" />
  <link rel="stylesheet" href="/css/verify.css?v=2.0.0" />
  <link rel="stylesheet" href="/css/responsive.css?v=2.0.0" />
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
  </svg>

  <div class="app-shell">
    <header class="topbar glass">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span></div>
        <div class="brand-text">
          <h1>PR•VISION</h1>
          <p>Investigation Report</p>
        </div>
      </div>

      <nav class="main-nav" aria-label="Primary">
        <a href="/dashboard"><svg class="icon"><use href="#i-radar"/></svg><span>Early Warning</span></a>
        <a href="/verify"><svg class="icon"><use href="#i-search"/></svg><span>Verify Anything</span></a>
        <a href="/cases"><svg class="icon"><use href="#i-folder"/></svg><span>Cases</span></a>
      </nav>

      <div class="topbar-status">
        <div class="status-pill" id="pill-job">
          <span class="dot"></span><span class="label">JOB</span><span class="value">…</span>
        </div>
        <div class="last-update" id="last-update">—</div>
      </div>
    </header>

    <main class="content" id="report-root">
      <div class="jobs-panel" style="text-align:center; padding: 60px 0;">
        <p style="color:var(--text-2)" id="loading-msg">Loading investigation…</p>
      </div>
    </main>
  </div>

  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

  <script src="/js/api.js?v=1.2.0"></script>
  <script src="/js/auth-chip.js?v=1.0.1"></script>
  <script src="/js/evidence-graph.js?v=1.3.0"></script>
  <script src="/js/report.js?v=1.2.0"></script>
</body>
</html>
