[alembic]
script_location = alembic
prepend_sys_path = .version . ..
# URL is injected from app.core.config at runtime (see env.py) —
# this value is only a fallback placeholder.
sqlalchemy.url = mysql+pymysql://prvision:change-me@localhost:3306/prvision

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
